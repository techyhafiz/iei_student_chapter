<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Site Under Maintenance | IEI Student Chapter</title>
  <meta name="google-site-verification" content="google784fb1d765be3eb8">
  <link rel="icon" type="image/webp" href="assets/menu-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .fullscreen-box {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 14px;
    }

    .logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      margin-bottom: 4px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: #0f172a;
      line-height: 1.1;
    }

    .sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      color: #64748b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main class="fullscreen-box">
    <img src="assets/menu-logo.webp" alt="IEI Logo" class="logo">
    <h1>Site Under Maintenance</h1>
    <p class="sub">IEI Student Chapter • Department of Cybersecurity</p>
  </main>
</body>

</html>
