<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEI Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"> <!-- Base styles -->
  <link rel="stylesheet" href="admin.css"> <!-- Reusing admin specific styles -->
  <link rel="stylesheet" href="reset-password.css"> <!-- Reset specific styles -->
  
  <!-- Initialize Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-container">
    <h2 class="mono">IEI_ADMIN<span>_RESET</span></h2>
    <p class="panel-desc">Set your new password below.</p>
    
    <div id="resetFormContainer">
      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required minlength="8">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" required minlength="8">
        </div>
        <div id="resetErrorMsg" class="error-msg hidden" aria-hidden="true"></div>
        <button type="submit" class="btn">Update Password</button>
      </form>
    </div>

    <div id="successContainer" class="hidden">
      <div class="msg success-msg">Password updated successfully.</div>
      <a href="/admin.html" class="btn back-btn" style="display: block; text-align: center; text-decoration: none; margin-top: 1rem;">Return to Admin Login</a>
    </div>
  </div>

  <script src="reset-password.js"></script>
</body>
</html>
